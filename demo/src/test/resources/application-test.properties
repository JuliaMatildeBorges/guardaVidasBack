# Desabilitar configurações que podem atrapalhar testes simples
spring.main.banner-mode=off
logging.level.org.springframework.web=DEBUG


# Banco H2 em memória — isolado para testes
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Desativa envio de e-mail nos testes
spring.mail.host=localhost
spring.mail.port=3025

# Path fictício para o ArquivoService (não será usado pois o bean é substituído)
arquivamento.path=/tmp/test-uploads